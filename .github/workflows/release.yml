name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.architecture }}
          GOOS: linux
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/glimpse-linux-${GOARCH}" ./cmd/glimpse
          cd dist
          sha256sum "glimpse-linux-${GOARCH}" > "glimpse-linux-${GOARCH}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: glimpse-linux-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: glimpse-linux-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
